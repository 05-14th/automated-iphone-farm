[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imessage-bridge-api"
version = "1.0.0"
description = "Public REST interface to the email-identity iMessage bridge. Writes to Supabase; never touches BlueBubbles."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "supabase==2.31.0",
  "postgrest==2.31.0",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.setuptools]
packages = ["app", "app.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
  "live: hits the real Supabase project. Creates rows and cleans up after itself.",
]

[tool.ruff]
line-length = 110
target-version = "py312"
